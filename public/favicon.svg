<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0D0D0F"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20C8BF"/>
      <stop offset="60%" stop-color="#20C8BF"/>
      <stop offset="100%" stop-color="#F8E07C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)"/>
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="url(#brandGrad)" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Brand Typography D. -->
  <text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Syne', 'Inter', sans-serif" font-weight="800" font-size="58" fill="url(#brandGrad)" filter="url(#glow)">D</text>
  <circle cx="75" cy="63" r="6" fill="#F8E07C" filter="url(#glow)"/>
</svg>